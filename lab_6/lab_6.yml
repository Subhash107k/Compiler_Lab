lab: 6
title: FIRST and FOLLOW Set Generator
language: C++
description: Computes FIRST and FOLLOW sets for the expression grammar used in compiler design.

grammar:
  - head: E
    productions:
      - [T, E']
  - head: E'
    productions:
      - [+, T, E']
      - [e]
  - head: T
    productions:
      - [F, T']
  - head: T'
    productions:
      - [*, F, T']
      - [e]
  - head: F
    productions:
      - [(, E, )]
      - [id]

build:
  command: g++ -std=c++17 -o lab_6.exe .\lab_6\lab_6.cpp

run:
  command: .\lab_6.exe

output:
  first_sets:
    E: [(, id]
    E': [+, e]
    T: [(, id]
    T': [*, e]
    F: [(, id]
  follow_sets:
    E: [$, )]
    E': [$, )]
    T: [+, $, )]
    T': [+, $, )]
    F: [*, +, $, )]
